<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday ❤️</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      padding: 50px;
      color: #fff;
    }

    h1 {
      font-size: 3em;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 20px #ff4d6d; }
    }

    .card {
      background: rgba(255,255,255,0.2);
      padding: 30px;
      border-radius: 20px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Happy Birthday My Love 🎂❤️</h1>

  <div class="card">
    <p>You make my world brighter every day ✨</p>
    <p>I’m so lucky to have you 💕</p>

    <button onclick="showMessage()">Click for a surprise 💌</button>
    <p id="hiddenMessage" style="display:none;">
      I love you more than words can explain ❤️
    </p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("hiddenMessage").style.display = "block";
    }
  </script>

</body>
</html>
